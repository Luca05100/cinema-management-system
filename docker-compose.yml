services:
  mariadb:
    image: mariadb:11
    container_name: cinema_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${password}
      MARIADB_DATABASE: cinema_system
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
